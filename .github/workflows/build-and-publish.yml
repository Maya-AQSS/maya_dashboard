name: build-and-publish
# Construye, prueba y publica en GHCR las 4 imágenes de maya-dashboard (api, worker,
# reverb y un solo frontend para todos los entornos, con /config.js: D26 R6) y su chart,
# con el workflow reutilizable de maya_platform. Después IaC las copia a la registry
# interna y las despliega en el K3s de desarrollo (IaC: .github/workflows/dev-deploy.yml,
# dev/PLAN.md).
#
#   push a main      → versión de desarrollo 0.0.0-main.<run>.g<sha> → K3s de desarrollo
#   tag vX.Y.Z       → versión X.Y.Z → K3s de desarrollo (producción: PR en IaC)
#   workflow_dispatch → la versión indicada (o la de desarrollo)
#
# Secretos: COMPOSER_AUTH (opcional). VITE_REVERB_APP_KEY ya no se usa con runtime_config
# (la clave llega en MAYA_PUBLIC_REVERB_APP_KEY del chart). El despliegue en desarrollo
# usa el environment `maya-dev-dispatch` de este repo (secretos MAYA_DISPATCH_APP_ID/KEY,
# solo main y tags v*): nunca se pasan desde aquí y una rama cualquiera no puede leerlos.

on:
  push:
    branches:
      - main
      # TRANSITORIO (plan-dev-k3s): quitar al fusionar en main.
      - plan-dev-k3s
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versión SemVer (sin 'v'). Vacío = versión de desarrollo."
        required: false
        default: ""

concurrency:
  group: build-and-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # TRANSITORIO (plan-dev-k3s): @main cuando build-app.yml esté fusionado en main de maya_platform.
    uses: Maya-AQSS/maya_platform/.github/workflows/build-app.yml@plan-dev-k3s
    permissions:
      contents: read
      packages: write
    with:
      app: maya-dashboard
      version: ${{ inputs.version || '' }}
      php_base: php-base:8.4
      # D26 R6: una sola imagen de frontend sin VITE_* de entorno; la SPA lee /config.js.
      runtime_config: true
    # Explícitos (no `inherit`): el reutilizable solo recibe lo que necesita. Los MAYA_DISPATCH_* solo existen en el
    # environment maya-dev-dispatch (main, plan-dev-k3s y etiquetas v*): hay que pasarlos por nombre igualmente, o en
    # el job deploy-dev (que declara ese environment) llegan vacíos.
    secrets:
      VITE_REVERB_APP_KEY: ${{ secrets.VITE_REVERB_APP_KEY }}
      COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
      MAYA_DISPATCH_APP_ID: ${{ secrets.MAYA_DISPATCH_APP_ID }}
      MAYA_DISPATCH_APP_KEY: ${{ secrets.MAYA_DISPATCH_APP_KEY }}
