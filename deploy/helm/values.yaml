# maya-dashboard — values de producción sobre el library chart maya-common (0.2.0).
# Solo lo que difiere de los defaults de maya-common (charts/maya-common/values.yaml).
#
# Secretos: Vault, ruta secret/data/maya-dashboard con las claves de vault.keys
# (REDIS_PASSWORD = SESSION_PASS de secret/data/redis; FDW_*_PASSWORD = contraseña
# del rol lector maya_fdw_reader). image.tag lo fija helmfile (misma versión que el chart).
# Hosts: dashboard.ceedcv.es (SPA) y api.dashboard.ceedcv.es (API y WebSocket en /app).

image:
  registry: 10.224.237.240:5000
  repository: maya/maya-dashboard
  tag: ''
  pullSecrets:
  - name: regcred
vault:
  keys:
  - APP_KEY
  - DB_PASSWORD
  - REDIS_PASSWORD
  - RABBITMQ_PASSWORD
  - REVERB_APP_KEY
  - REVERB_APP_SECRET
  - FDW_ODOO_PASSWORD
  - FDW_USER_PERMISSIONS_PASSWORD
  - LOG_MGMT_DB_PASSWORD
config:
  APP_FAKER_LOCALE: es_ES
  APP_FALLBACK_LOCALE: es
  APP_LOCALE: es
  APP_MAINTENANCE_DRIVER: file
  APP_NAME: Maya Dashboard
  APP_URL: https://api.dashboard.ceedcv.es
  BCRYPT_ROUNDS: '12'
  BROADCAST_CONNECTION: reverb
  CACHE_STORE: redis
  CORS_ADDITIONAL_ORIGINS: ''
  CORS_REGEX_DOMAIN: ceedcv.es
  DB_CONNECTION: pgsql
  DB_DATABASE: maya_dashboard
  DB_HOST: 10.224.237.252
  DB_PORT: '5432'
  DB_USERNAME: dashboard_user
  FDW_ODOO_DATABASE: maya_erp
  FDW_ODOO_HOST: 10.224.237.252
  FDW_ODOO_PORT: '5432'
  FDW_ODOO_USERNAME: maya_fdw_reader
  FDW_USER_PERMISSIONS_DATABASE: maya_auth
  FDW_USER_PERMISSIONS_HOST: 10.224.237.252
  FDW_USER_PERMISSIONS_PORT: '5432'
  FDW_USER_PERMISSIONS_REMOTE_VIEW: v_portal_user_permissions
  FDW_USER_PERMISSIONS_SCHEMA: public
  FDW_USER_PERMISSIONS_USERNAME: maya_fdw_reader
  FILESYSTEM_DISK: local
  JWKS_CACHE_TTL: '3600'
  JWKS_URL: http://keycloak-maya-app.maya-iam.svc.cluster.local:8080/realms/CEED/protocol/openid-connect/certs
  JWT_AUDIENCE: maya-dashboard-backend,maya-audit,maya-dms,maya-logs
  JWT_ISSUER: https://keycloak.ceedcv.es/realms/CEED
  LOG_CHANNEL: stack
  LOG_DEPRECATIONS_CHANNEL: 'null'
  LOG_LEVEL: info
  LOG_MGMT_DB_DATABASE: log_mgmt_db
  LOG_MGMT_DB_HOST: 10.224.237.252
  LOG_MGMT_DB_PORT: '5432'
  LOG_MGMT_DB_USERNAME: log_mgmt_readonly
  LOG_RABBIT_LEVEL: warning
  LOG_STACK: stderr,rabbit
  MAIL_FROM_ADDRESS: noreply@ceedcv.es
  MAIL_FROM_NAME: Maya Dashboard
  MAIL_MAILER: log
  MAYA_MESSAGING_APP: maya-dashboard
  QUEUE_CONNECTION: redis
  RABBITMQ_HOST: rabbitmq-maya-app.maya-sync.svc.cluster.local
  RABBITMQ_PORT: '5672'
  RABBITMQ_USER: maya_dashboard
  RABBITMQ_VHOST: /maya
  REDIS_CACHE_DB: '3'
  REDIS_CLIENT: phpredis
  REDIS_DB: '2'
  REDIS_HOST: redis-session-maya-app.maya-infra.svc.cluster.local
  REDIS_PORT: '6379'
  REVERB_APP_ID: maya-dashboard
  REVERB_HOST: maya-dashboard-reverb
  REVERB_PORT: '8080'
  REVERB_SCHEME: http
  REVERB_SERVER_HOST: 0.0.0.0
  REVERB_SERVER_PORT: '8080'
  SESSION_DOMAIN: .ceedcv.es
  SESSION_DRIVER: redis
  SESSION_ENCRYPT: 'true'
  SESSION_LIFETIME: '120'
  SESSION_PATH: /
  SESSION_SAME_SITE: lax
frontend:
  env:
    MAYA_PUBLIC_APP_NAME: Maya Dashboard
    MAYA_PUBLIC_API_URL: https://api.dashboard.ceedcv.es/api/v1
    MAYA_PUBLIC_KEYCLOAK_URL: https://keycloak.ceedcv.es
    MAYA_PUBLIC_KEYCLOAK_REALM: CEED
    MAYA_PUBLIC_KEYCLOAK_CLIENT_ID: maya-dashboard
    MAYA_PUBLIC_DASHBOARD_URL: https://dashboard.ceedcv.es
    MAYA_PUBLIC_DASHBOARD_API_URL: https://api.dashboard.ceedcv.es
    MAYA_PUBLIC_PEER_HOST_PATTERN: subdomain-api
    MAYA_PUBLIC_REVERB_HOST: api.dashboard.ceedcv.es
    MAYA_PUBLIC_REVERB_PORT: '443'
    MAYA_PUBLIC_REVERB_SCHEME: https
    MAYA_PUBLIC_REVERB_AUTH_ENDPOINT: https://api.dashboard.ceedcv.es/api/v1/broadcasting/auth
    MAYA_PUBLIC_REVERB_APP_KEY: CHANGE-ME
    MAYA_CSP: 'default-src ''self''; script-src ''self''; style-src ''self'' ''unsafe-inline''; img-src ''self'' data: blob:;
      font-src ''self'' data:; connect-src ''self'' https://api.dashboard.ceedcv.es https://api.dashboard.ceedcv.es https://keycloak.ceedcv.es
      wss://api.dashboard.ceedcv.es; frame-src https://keycloak.ceedcv.es; frame-ancestors ''none''; base-uri ''self''; form-action
      ''self'''
scheduler:
  enabled: true
ingress:
  host: dashboard.ceedcv.es
  apiHost: api.dashboard.ceedcv.es
networkPolicy:
  egress:
    cidrs:
    - cidr: 10.224.237.252/32
      ports:
      - 5432
    namespaces:
    - name: maya-infra
      ports:
      - 6379
    - name: maya-sync
      ports:
      - 5672
    - name: maya-iam
      ports:
      - 8080
    internet: false
