<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PortalCEED</title>
    <!--
      Antes que el bundle y como ficheros, no en línea: la CSP de producción es
      script-src 'self'.
      - /config.js: configuración en ejecución (D26 R6). En la imagen la genera
        maya/web-base al arrancar desde las MAYA_PUBLIC_* del chart; en Vite es
        public/config.js (vacío) y la app usa los VITE_*.
      - /process-shim.js: `process` para react-draggable (ver el fichero).
    -->
    <script src="/config.js"></script>
    <script src="/process-shim.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
